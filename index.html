<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-three.prod.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #000;
      }
      #container {
        width: 100vw;
        height: 100vh;
        position: relative;
        overflow: hidden;
      }
      /* Scanning Line Animation */
      .scan-line {
        position: absolute;
        top: 0;
        left: 10%;
        width: 80%;
        height: 4px;
        background: rgba(0, 255, 128, 0.8);
        box-shadow: 0 0 15px rgba(0, 255, 128, 0.8);
        animation: scan 2.5s infinite ease-in-out;
        z-index: 10;
        pointer-events: none;
      }
      @keyframes scan {
        0% { top: 20%; opacity: 0.2; }
        50% { top: 80%; opacity: 1; }
        100% { top: 20%; opacity: 0.2; }
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="scanner" class="scan-line"></div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const start = async () => {
          const mindarThree = new window.MINDAR.IMAGE.MindARThree({
            container: document.querySelector("#container"),
            imageTargetSrc: "./assets/targets.mind",
            filterMinCF: 0.0001,
            filterBeta: 0.001
          });

          const { renderer, scene, camera } = mindarThree;

          // Load overlay image
          const texture = new THREE.TextureLoader().load('./assets/asset.jpeg');
          const geometry = new THREE.PlaneGeometry(1.3, 0.8);
          const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
          const plane = new THREE.Mesh(geometry, material);

          // Attach plane to target
          const anchor = mindarThree.addAnchor(0);
          anchor.group.add(plane);

          // Hide scanning line once target is found
          const scannerEl = document.querySelector("#scanner");
          anchor.onTargetFound = () => {
            scannerEl.style.display = "none";
          };
          anchor.onTargetLost = () => {
            scannerEl.style.display = "block";
          };

          await mindarThree.start();

          renderer.setAnimationLoop(() => {
            renderer.render(scene, camera);
          });
        };

        start();
      });
    </script>
  </body>
</html>
