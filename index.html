<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WebAR T-Shirt Experience</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: transparent;
      }
      #snap-btn {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 70px;
        height: 70px;
        background-color: #ffffff;
        border: 4px solid #00ff80;
        border-radius: 50%;
        z-index: 9999;
        cursor: pointer;
        outline: none;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      }
      #preview-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.9);
        z-index: 99999;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      #preview-img {
        max-width: 85%;
        max-height: 75%;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0,255,128,0.4);
      }
      #save-instructions {
        color: #fff;
        margin-top: 15px;
        font-family: sans-serif;
        font-size: 14px;
      }
      #close-btn {
        margin-top: 15px;
        padding: 10px 24px;
        background: #00ff80;
        border: none;
        border-radius: 20px;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button id="snap-btn" aria-label="Take Photo"></button>

    <div id="preview-modal">
      <img id="preview-img" alt="Captured WebAR Snap" />
      <div id="save-instructions">Press and hold image to <b>Save to Photos</b></div>
      <button id="close-btn">Take Another</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes; missTolerance: 30; warmupTolerance: 1; filterMinCF: 0.00001; filterBeta: 0.0001;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights, preserveDrawingBuffer: true, alpha: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="overlay" src="./assets/asset.png" crossorigin="anonymous" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <a-plane 
          id="plane"
          src="#overlay" 
          position="0 0 0" 
          height="1.0" 
          width="1.0" 
          rotation="0 0 0"
          visible="false"
          material="transparent: true; alphaTest: 0.5;">
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      AFRAME.registerComponent('ar-tracker', {
        init: function () {
          const planeEl = document.querySelector("#plane");
          
          this.el.addEventListener("targetFound", () => {
            if (planeEl) planeEl.setAttribute("visible", "true");
          });

          this.el.addEventListener("targetLost", () => {
            if (planeEl) planeEl.setAttribute("visible", "false");
          });
        }
      });

      document.querySelector("#target").setAttribute("ar-tracker", "");

      const snapBtn = document.querySelector("#snap-btn");
      const modal = document.querySelector("#preview-modal");
      const previewImg = document.querySelector("#preview-img");
      const closeBtn = document.querySelector("#close-btn");

      snapBtn.addEventListener("click", () => {
        const sceneEl = document.querySelector("a-scene");
        const video = document.querySelector("video");

        requestAnimationFrame(() => {
          sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);

          const canvas = document.createElement("canvas");
          canvas.width = video.videoWidth || window.innerWidth;
          canvas.height = video.videoHeight || window.innerHeight;
          const ctx = canvas.getContext("2d");

          const webglCanvas = sceneEl.renderer.domElement;

          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          ctx.drawImage(webglCanvas, 0, 0, canvas.width, canvas.height);

          previewImg.src = canvas.toDataURL("image/png");
          modal.style.display = "flex";
        });
      });

      closeBtn.addEventListener("click", () => {
        modal.style.display = "none";
      });
    </script>
  </body>
</html>
