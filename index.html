<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebAR T-Shirt Experience</title>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
    </style>
    <script>
      // Custom A-Frame component to handle strict visibility toggling
      AFRAME.registerComponent('track-visibility', {
        init: function () {
          const el = this.el;
          const overlayPlane = this.el.querySelector('.ar-overlay');

          // Hide on init
          if (overlayPlane) overlayPlane.setAttribute('visible', false);

          el.addEventListener('targetFound', () => {
            if (overlayPlane) overlayPlane.setAttribute('visible', true);
          });

          el.addEventListener('targetLost', () => {
            if (overlayPlane) overlayPlane.setAttribute('visible', false);
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="overlay" src="./assets/asset.jpeg" crossorigin="anonymous" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" track-visibility>
        <a-plane 
          class="ar-overlay"
          src="#overlay" 
          position="0 0 0" 
          height="0.8" 
          width="1.3" 
          rotation="0 0 0"
          visible="false">
        </a-plane>
      </a-entity>
    </a-scene>
  </body>
</html>
