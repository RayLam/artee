<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WebAR T-Shirt Experience</title>
    <!-- Load Three.js core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Load MindAR Three.js engine -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #000;
        font-family: sans-serif;
      }
      #container {
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      #start-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      #start-btn {
        padding: 16px 32px;
        font-size: 18px;
        font-weight: bold;
        color: #000;
        background-color: #00ff80;
        border: none;
        border-radius: 30px;
        cursor: pointer;
      }
      #status {
        color: #fff;
        margin-top: 15px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="start-overlay">
      <button id="start-btn">START AR CAMERA</button>
      <div id="status">Tap button to start camera</div>
    </div>

    <div id="container"></div>

    <script>
      const startBtn = document.getElementById("start-btn");
      const overlay = document.getElementById("start-overlay");
      const statusEl = document.getElementById("status");

      startBtn.addEventListener("click", async () => {
        statusEl.innerText = "Initializing camera...";

        try {
          const mindarThree = new window.MINDAR.IMAGE.MindARThree({
            container: document.querySelector("#container"),
            imageTargetSrc: "./assets/targets.mind",
            filterMinCF: 0.0001,
            filterBeta: 0.001
          });

          const { renderer, scene, camera } = mindarThree;

          // Load image overlay
          const texture = new THREE.TextureLoader().load('./assets/asset.jpeg');
          const geometry = new THREE.PlaneGeometry(1.3, 0.8);
          const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
          const plane = new THREE.Mesh(geometry, material);
          plane.visible = false; // Start hidden

          // Attach to target anchor
          const anchor = mindarThree.addAnchor(0);
          anchor.group.add(plane);

          anchor.onTargetFound = () => { plane.visible = true; };
          anchor.onTargetLost = () => { plane.visible = false; };

          // Start engine & camera
          await mindarThree.start();
          overlay.style.display = "none";

          renderer.setAnimationLoop(() => {
            renderer.render(scene, camera);
          });
        } catch (err) {
          statusEl.innerText = "Error: " + err.message;
        }
      });
    </script>
  </body>
</html>
