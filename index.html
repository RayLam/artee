<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WebAR T-Shirt Experience</title>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #000;
        font-family: sans-serif;
      }
      #start-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      #start-btn {
        padding: 16px 32px;
        font-size: 18px;
        font-weight: bold;
        color: #000;
        background-color: #00ff80;
        border: none;
        border-radius: 30px;
        cursor: pointer;
      }
      #status-msg {
        color: #fff;
        margin-top: 15px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="start-overlay">
      <button id="start-btn">START AR CAMERA</button>
      <div id="status-msg">Tap to grant camera permissions</div>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false; uiLoading: yes; uiScanning: yes; uiError: yes;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script>
      const startBtn = document.getElementById("start-btn");
      const overlay = document.getElementById("start-overlay");
      const statusMsg = document.getElementById("status-msg");

      startBtn.addEventListener("click", () => {
        statusMsg.innerText = "Requesting camera...";
        const sceneEl = document.querySelector("a-scene");
        const arSystem = sceneEl.systems["mindar-image-system"];

        arSystem.start().then(() => {
          overlay.style.display = "none";
        }).catch((err) => {
          statusMsg.innerText = "Camera access denied or failed: " + err;
        });
      });

      window.addEventListener("load", () => {
        const targetEl = document.querySelector("#target");
        let overlayMesh = null;

        const textureLoader = new THREE.TextureLoader();
        textureLoader.load("./assets/asset.jpeg", (texture) => {
          const geometry = new THREE.PlaneGeometry(1.3, 0.8);
          const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
          overlayMesh = new THREE.Mesh(geometry, material);
          overlayMesh.visible = false;

          targetEl.object3D.add(overlayMesh);
        });

        targetEl.addEventListener("targetFound", () => {
          if (overlayMesh) overlayMesh.visible = true;
        });

        targetEl.addEventListener("targetLost", () => {
          if (overlayMesh) overlayMesh.visible = false;
        });
      });
    </script>
  </body>
</html>
