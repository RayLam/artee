<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WebAR T-Shirt Experience</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: transparent;
      }
      #snap-btn {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 70px;
        height: 70px;
        background-color: #ffffff;
        border: 4px solid #00ff80;
        border-radius: 50%;
        z-index: 9999;
        cursor: pointer;
        outline: none;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      }
      #preview-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.9);
        z-index: 99999;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      #preview-img {
        max-width: 85%;
        max-height: 65%;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0,255,128,0.4);
      }
      .btn-group {
        display: flex;
        gap: 15px;
        margin-top: 20px;
      }
      .modal-btn {
        padding: 12px 24px;
        border: none;
        border-radius: 25px;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
      }
      #save-btn {
        background-color: #00ff80;
        color: #000;
      }
      #close-btn {
        background-color: #ffffff;
        color: #000;
      }
      /* Debug UI */
      #ar-debug-ui {
        position: fixed;
        right: 12px;
        top: 12px;
        z-index: 100000;
        background: rgba(0,0,0,0.6);
        color: #fff;
        padding: 8px;
        border-radius: 8px;
        font-family: sans-serif;
        font-size: 12px;
      }
      #ar-debug-ui button, #ar-debug-ui input {
        margin-top: 6px;
        display: block;
        width: 100%;
      }
      #ar-debug-status { color: #0f0; font-family: monospace; margin-top:6px; }
    </style>
  </head>
  <body>
    <button id="snap-btn" aria-label="Take Photo"></button>

    <div id="preview-modal">
      <img id="preview-img" alt="Captured WebAR Snap" />
      <div class="btn-group">
        <button id="save-btn" class="modal-btn">Save to Photos</button>
        <button id="close-btn" class="modal-btn">Retake</button>
      </div>
    </div>

    <div id="ar-debug-ui">
      <div><strong>AR Debug</strong></div>
      <div id="ar-debug-status">init...</div>
      <button id="dbg-toggle-visible">Toggle Visible</button>
      <button id="dbg-use-png">Use PNG</button>
      <button id="dbg-use-jpeg">Use JPEG</button>
      <label>Offset X: <span id="dbg-offset-val">-0.06</span></label>
      <input id="dbg-offset" type="range" min="-0.2" max="0.2" step="0.01" value="-0.06" />
      <button id="dbg-show-on-target">Show on Target Only</button>
      <button id="dbg-show-always">Show Always</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes; missTolerance: 30; warmupTolerance: 1; filterMinCF: 0.00001; filterBeta: 0.00[...]"
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights, preserveDrawingBuffer: true, alpha: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="overlay-png" src="./assets/asset.png?v=11" crossorigin="anonymous" />
        <img id="overlay-jpeg" src="./assets/asset.jpeg" crossorigin="anonymous" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <!-- Background plane positioned behind -->
        <a-plane 
          id="plane-bg"
          src=""
          position="-0.06 0 -0.1" 
          height="1.2" 
          width="1.2" 
          rotation="0 0 0"
          visible="true"
          material="shader: flat; side: double; depthTest: false;">
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      // small on-screen debug label already present as #ar-debug-status

      AFRAME.registerComponent('ar-tracker', {
        init: function () {
          const planeEl = document.querySelector('#plane-bg');
          const png = document.getElementById('overlay-png');
          const jpeg = document.getElementById('overlay-jpeg');
          const status = document.getElementById('ar-debug-status');

          function updateStatus(msg, color){
            if (status) { status.innerText = msg; status.style.color = color || '#0f0'; }
            console.log('[ar-debug]', msg);
          }

          function applyAsset(assetId, isPNG){
            if (!planeEl) return;
            planeEl.setAttribute('src', assetId);
            planeEl.setAttribute('material', `shader: flat; src: ${assetId}; transparent: ${isPNG}; side: double; depthTest: false;`);
            try {
              if (planeEl.components && planeEl.components.material && planeEl.components.material.material && planeEl.components.material.material.map) {
                planeEl.components.material.material.map.needsUpdate = true;
              }
            } catch(e){ console.warn('force needsUpdate failed', e); }
            updateStatus(`using ${assetId}`);
            chosen = assetId;
          }

          // chosen asset id
          let chosen = null;
          // initial: prefer png if it has pixels
          if (png && png.complete && png.naturalWidth > 0) { chosen = '#overlay-png'; }
          else if (jpeg && jpeg.complete && jpeg.naturalWidth > 0) { chosen = '#overlay-jpeg'; }

          // onload handlers
          if (png) png.onload = () => { if (!chosen && png.naturalWidth>0) { applyAsset('#overlay-png', true); } };
          if (jpeg) jpeg.onload = () => { if (!chosen && jpeg.naturalWidth>0) { applyAsset('#overlay-jpeg', false); } };

          // fallback after short wait
          setTimeout(() => {
            if (!chosen) {
              if (png && png.complete && png.naturalWidth>0) { applyAsset('#overlay-png', true); }
              else if (jpeg && jpeg.complete && jpeg.naturalWidth>0) { applyAsset('#overlay-jpeg', false); }
              else updateStatus('assets not loaded - check Network/Console', '#ff0');
            } else {
              // apply chosen now
              applyAsset(chosen, chosen === '#overlay-png');
            }
          }, 350);

          // overlay offset state
          let overlayOffsetX = parseFloat(document.getElementById('dbg-offset').value || -0.06);
          let showOnTargetOnly = false;

          // event listeners for target detection
          this.el.addEventListener('targetFound', () => {
            if (!planeEl) return;
            planeEl.setAttribute('position', `${overlayOffsetX} 0 -0.1`);
            if (showOnTargetOnly) planeEl.setAttribute('visible', 'true');
            updateStatus(`targetFound (offset ${overlayOffsetX})`);
          });
          this.el.addEventListener('targetLost', () => { if (planeEl && showOnTargetOnly) planeEl.setAttribute('visible', 'false'); updateStatus('targetLost'); });

          // Wire debug UI buttons
          const btnToggle = document.getElementById('dbg-toggle-visible');
          const btnPng = document.getElementById('dbg-use-png');
          const btnJpeg = document.getElementById('dbg-use-jpeg');
          const inputOffset = document.getElementById('dbg-offset');
          const offsetVal = document.getElementById('dbg-offset-val');
          const btnShowOn = document.getElementById('dbg-show-on-target');
          const btnShowAlways = document.getElementById('dbg-show-always');

          if (btnToggle) btnToggle.addEventListener('click', () => {
            if (!planeEl) return;
            const vis = planeEl.getAttribute('visible');
            planeEl.setAttribute('visible', !vis);
          });
          if (btnPng) btnPng.addEventListener('click', () => applyAsset('#overlay-png', true));
          if (btnJpeg) btnJpeg.addEventListener('click', () => applyAsset('#overlay-jpeg', false));
          if (inputOffset) inputOffset.addEventListener('input', (e) => {
            overlayOffsetX = parseFloat(e.target.value);
            if (offsetVal) offsetVal.innerText = overlayOffsetX.toFixed(2);
            if (planeEl) planeEl.setAttribute('position', `${overlayOffsetX} 0 -0.1`);
          });
          if (btnShowOn) btnShowOn.addEventListener('click', () => { showOnTargetOnly = true; if (planeEl) planeEl.setAttribute('visible', 'false'); updateStatus('show on target only'); });
          if (btnShowAlways) btnShowAlways.addEventListener('click', () => { showOnTargetOnly = false; if (planeEl) planeEl.setAttribute('visible', 'true'); updateStatus('show always'); });

          // apply initial visibility according to showOnTargetOnly
          if (planeEl && !showOnTargetOnly) planeEl.setAttribute('visible', 'true');
        }
      });

      // Attach component to target
      const tgt = document.querySelector('#target');
      if (tgt) tgt.setAttribute('ar-tracker', '');

      const snapBtn = document.querySelector("#snap-btn");
      const modal = document.querySelector("#preview-modal");
      const previewImg = document.querySelector("#preview-img");
      const saveBtn = document.querySelector("#save-btn");
      const closeBtn = document.querySelector("#close-btn");
      let currentImageBase64 = "";

      snapBtn.addEventListener("click", () => {
        const sceneEl = document.querySelector("a-scene");
        const video = document.querySelector("video");
        if (!sceneEl || !sceneEl.renderer || !sceneEl.camera) return;

        try {
          sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
        } catch (err) {
          console.warn('Renderer render failed', err);
        }

        const canvas = document.createElement("canvas");
        canvas.width = (video && video.videoWidth) ? video.videoWidth : window.innerWidth;
        canvas.height = (video && video.videoHeight) ? video.videoHeight : window.innerHeight;
        const ctx = canvas.getContext("2d");

        const webglCanvas = sceneEl.renderer.domElement;

        if (video) ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        if (webglCanvas) ctx.drawImage(webglCanvas, 0, 0, canvas.width, canvas.height);

        currentImageBase64 = canvas.toDataURL("image/png");
        previewImg.src = currentImageBase64;
        modal.style.display = "flex";
      });

      saveBtn.addEventListener("click", async () => {
        if (!currentImageBase64) return;

        const res = await fetch(currentImageBase64);
        const blob = await res.blob();
        const file = new File([blob], "webar-photo.png", { type: "image/png" });

        if (navigator.share && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: "AR T-Shirt Photo",
            });
          } catch (err) {
            console.log("Share dismissed", err);
          }
        } else {
          const link = document.createElement("a");
          link.href = currentImageBase64;
          link.download = "webar-photo.png";
          link.click();
        }
      });

      closeBtn.addEventListener("click", () => {
        modal.style.display = "none";
      });
    </script>
  </body>
</html>
