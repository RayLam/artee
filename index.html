<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebAR T-Shirt Experience</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #000;
      }
    </style>
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes; missTolerance: 30; warmupTolerance: 1; filterMinCF: 0.00001; filterBeta: 0.0001;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="overlay" src="./assets/asset.jpeg" crossorigin="anonymous" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <a-plane 
          id="plane"
          src="#overlay" 
          position="0 0 0" 
          height="0.8" 
          width="1.3" 
          rotation="0 0 0"
          visible="false">
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      AFRAME.registerComponent('ar-tracker', {
        init: function () {
          const planeEl = document.querySelector("#plane");
          
          this.el.addEventListener("targetFound", () => {
            if (planeEl) planeEl.setAttribute("visible", "true");
          });

          this.el.addEventListener("targetLost", () => {
            if (planeEl) planeEl.setAttribute("visible", "false");
          });
        }
      });

      document.querySelector("#target").setAttribute("ar-tracker", "");
    </script>
  </body>
</html>
