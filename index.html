<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WebAR T-Shirt Experience</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: transparent;
      }
      #snap-btn {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 70px;
        height: 70px;
        background-color: #ffffff;
        border: 4px solid #00ff80;
        border-radius: 50%;
        z-index: 9999;
        cursor: pointer;
        outline: none;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      }
      #preview-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.9);
        z-index: 99999;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      #preview-img {
        max-width: 85%;
        max-height: 65%;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0,255,128,0.4);
      }
      .btn-group {
        display: flex;
        gap: 15px;
        margin-top: 20px;
      }
      .modal-btn {
        padding: 12px 24px;
        border: none;
        border-radius: 25px;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
      }
      #save-btn {
        background-color: #00ff80;
        color: #000;
      }
      #close-btn {
        background-color: #ffffff;
        color: #000;
      }
    </style>
  </head>
  <body>
    <button id="snap-btn" aria-label="Take Photo"></button>

    <div id="preview-modal">
      <img id="preview-img" alt="Captured WebAR Snap" />
      <div class="btn-group">
        <button id="save-btn" class="modal-btn">Save to Photos</button>
        <button id="close-btn" class="modal-btn">Retake</button>
      </div>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes; missTolerance: 30; warmupTolerance: 1; filterMinCF: 0.00001; filterBeta: 0.00"
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights, preserveDrawingBuffer: true, alpha: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="overlay" src="./assets/asset.png?v=11" crossorigin="anonymous" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <a-plane 
          id="plane"
          src="#overlay" 
          position="0 0 -5" 
          height="1.2" 
          width="1.2" 
          rotation="0 0 0"
          visible="false"
          material="shader: flat; src: #overlay; transparent: true; alphaTest: 0.1; renderOrder: -1;">
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      AFRAME.registerComponent('ar-tracker', {
        init: function () {
          const planeEl = document.querySelector("#plane");
          
          this.el.addEventListener("targetFound", () => {
            if (planeEl) {
              // Force texture re-binding to fix grey mesh artifact
              planeEl.setAttribute("material", "src", "#overlay");
              planeEl.setAttribute("visible", "true");
            }
          });

          this.el.addEventListener("targetLost", () => {
            if (planeEl) planeEl.setAttribute("visible", "false");
          });
        }
      });

      document.querySelector("#target").setAttribute("ar-tracker", "");

      const snapBtn = document.querySelector("#snap-btn");
      const modal = document.querySelector("#preview-modal");
      const previewImg = document.querySelector("#preview-img");
      const saveBtn = document.querySelector("#save-btn");
      const closeBtn = document.querySelector("#close-btn");
      let currentImageBase64 = "";

      snapBtn.addEventListener("click", () => {
        const sceneEl = document.querySelector("a-scene");
        const video = document.querySelector("video");

        sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);

        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth || window.innerWidth;
        canvas.height = video.videoHeight || window.innerHeight;
        const ctx = canvas.getContext("2d");

        const webglCanvas = sceneEl.renderer.domElement;

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.drawImage(webglCanvas, 0, 0, canvas.width, canvas.height);

        currentImageBase64 = canvas.toDataURL("image/png");
        previewImg.src = currentImageBase64;
        modal.style.display = "flex";
      });

      saveBtn.addEventListener("click", async () => {
        if (!currentImageBase64) return;

        const res = await fetch(currentImageBase64);
        const blob = await res.blob();
        const file = new File([blob], "webar-photo.png", { type: "image/png" });

        if (navigator.share && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: "AR T-Shirt Photo",
            });
          } catch (err) {
            console.log("Share dismissed", err);
          }
        } else {
          const link = document.createElement("a");
          link.href = currentImageBase64;
          link.download = "webar-photo.png";
          link.click();
        }
      });

      closeBtn.addEventListener("click", () => {
        modal.style.display = "none";
      });
    </script>
  </body>
</html>
