<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WebAR T-Shirt Experience</title>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const sceneEl = document.querySelector("a-scene");
        const targetEl = document.querySelector("#target");

        sceneEl.addEventListener("loaded", () => {
          // Create Three.js mesh manually
          const texture = new THREE.TextureLoader().load("./assets/asset.jpeg");
          const geometry = new THREE.PlaneGeometry(1.3, 0.8);
          const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
          const mesh = new THREE.Mesh(geometry, material);

          // Force invisible on startup
          mesh.visible = false;

          // Attach directly to MindAR anchor group
          const object3D = targetEl.object3D;
          object3D.add(mesh);

          // Toggle visibility on target events
          targetEl.addEventListener("targetFound", () => {
            mesh.visible = true;
          });

          targetEl.addEventListener("targetLost", () => {
            mesh.visible = false;
          });
        });
      });
    </script>
  </body>
</html>
