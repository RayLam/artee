<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WebAR T-Shirt Tracking</title>
    <!-- A-Frame 1.4.2 -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- MindAR A-Frame Official Build -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        font-family: sans-serif;
      }
      #start-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #start-btn {
        padding: 16px 32px;
        font-size: 18px;
        font-weight: bold;
        color: #000;
        background-color: #00ff80;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 0 15px rgba(0, 255, 128, 0.5);
      }
    </style>
  </head>
  <body>
    <!-- User Tap Overlay to Enable Camera on Mobile Safari/Chrome -->
    <div id="start-overlay">
      <button id="start-btn">TAP TO START AR</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false; uiLoading: no; uiScanning: yes;" 
      color-space="sRGB" 
      embedded
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="overlay" src="./assets/asset.jpeg" crossorigin="anonymous" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane 
          src="#overlay" 
          position="0 0 0" 
          height="0.8" 
          width="1.3" 
          rotation="0 0 0">
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      const startBtn = document.getElementById("start-btn");
      const overlay = document.getElementById("start-overlay");

      startBtn.addEventListener("click", () => {
        overlay.style.display = "none";
        const sceneEl = document.querySelector("a-scene");
        const arSystem = sceneEl.systems["mindar-image-system"];
        arSystem.start(); // Start camera after user tap
      });
    </script>
  </body>
</html>
