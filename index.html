<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebAR T-Shirt Experience</title>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="overlay" src="./assets/asset.jpeg" crossorigin="anonymous" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target-entity" mindar-image-target="targetIndex: 0">
        <!-- Plane starts with scale 0 0 0 so it is physically impossible to see on screen -->
        <a-plane 
          id="ar-overlay"
          src="#overlay" 
          position="0 0 0" 
          scale="0 0 0"
          height="0.8" 
          width="1.3" 
          rotation="0 0 0">
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const targetEntity = document.querySelector("#target-entity");
        const overlayPlane = document.querySelector("#ar-overlay");

        // Only scale the plane up to normal size when MindAR locks onto the t-shirt
        targetEntity.addEventListener("targetFound", () => {
          overlayPlane.setAttribute("scale", "1 1 1");
        });

        // Instantly shrink scale back to zero when looking away
        targetEntity.addEventListener("targetLost", () => {
          overlayPlane.setAttribute("scale", "0 0 0");
        });
      });
    </script>
  </body>
</html>
