<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;  /* AR scene in front */
    }

    #overlay-content {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1;   /* Push behind AR canvas */
      background: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 20px;
    }
  </style>
</head>
<body>
  <!-- Background overlay (behind AR) -->
  <div id="overlay-content">
    <p>This content is behind the AR scene</p>
  </div>

  <!-- AR Canvas (in front) -->
  <canvas id="ar-canvas"></canvas>
</body>
</html>
