<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebAR T-Shirt Experience</title>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #000;
      }
    </style>
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target container without any HTML plane inside it -->
      <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script>
      window.addEventListener("load", () => {
        const targetEl = document.querySelector("#target");
        let overlayMesh = null;

        // Load overlay texture via Three.js in memory
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load("./assets/asset.jpeg", (texture) => {
          const geometry = new THREE.PlaneGeometry(1.3, 0.8);
          const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
          overlayMesh = new THREE.Mesh(geometry, material);
          overlayMesh.visible = false; // Force invisible in Three.js memory

          // Attach mesh directly to the target's 3D object matrix
          targetEl.object3D.add(overlayMesh);
        });

        // Event listeners to toggle visibility
        targetEl.addEventListener("targetFound", () => {
          if (overlayMesh) overlayMesh.visible = true;
        });

        targetEl.addEventListener("targetLost", () => {
          if (overlayMesh) overlayMesh.visible = false;
        });
      });
    </script>
  </body>
</html>
