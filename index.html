<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WebAR T-Shirt Experience</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: transparent;
      }
      /* Photo Capture Button */
      #snap-btn {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 70px;
        height: 70px;
        background-color: #ffffff;
        border: 4px solid #00ff80;
        border-radius: 50%;
        z-index: 99999;
        cursor: pointer;
        outline: none;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      }
      #snap-btn:active {
        transform: translateX(-50%) scale(0.9);
        background-color: #00ff80;
      }
    </style>
  </head>
  <body>
    <!-- Shutter Button -->
    <button id="snap-btn" aria-label="Take Photo"></button>

    <a-scene 
      mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes; missTolerance: 30; warmupTolerance: 1; filterMinCF: 0.00001; filterBeta: 0.0001;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights, preserveDrawingBuffer: true, alpha: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="overlay" src="./assets/asset.jpeg" crossorigin="anonymous" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <!-- Standard transparent material (prevents black screen artifact) -->
        <a-plane 
          id="plane"
          src="#overlay" 
          position="0 0 0" 
          height="0.8" 
          width="1.3" 
          rotation="0 0 0"
          visible="false"
          material="transparent: true; opacity: 0.95;">
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      AFRAME.registerComponent('ar-tracker', {
        init: function () {
          const planeEl = document.querySelector("#plane");
          
          this.el.addEventListener("targetFound", () => {
            if (planeEl) planeEl.setAttribute("visible", "true");
          });

          this.el.addEventListener("targetLost", () => {
            if (planeEl) planeEl.setAttribute("visible", "false");
          });
        }
      });

      document.querySelector("#target").setAttribute("ar-tracker", "");

      // Snapshot functionality
      document.querySelector("#snap-btn").addEventListener("click", () => {
        const scene = document.querySelector("a-scene");
        const video = document.querySelector("video");
        
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth || window.innerWidth;
        canvas.height = video.videoHeight || window.innerHeight;
        const ctx = canvas.getContext("2d");

        // 1. Draw live camera video
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // 2. Overlay AR graphic
        const webglCanvas = scene.renderer.domElement;
        ctx.drawImage(webglCanvas, 0, 0, canvas.width, canvas.height);

        // 3. Download image
        const dataURL = canvas.toDataURL("image/png");
        const link = document.createElement("a");
        link.download = "webar-photo.png";
        link.href = dataURL;
        link.click();
      });
    </script>
  </body>
</html>
